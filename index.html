<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>አስቸኳይ የስራ ቅጥር - የውሃ ፋብሪካ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0077b6;
      --primary-dark: #023e8a;
      --primary-light: #e0f2fe;
      --accent: #00b4d8;
      --accent-glow: #90e0ef;
      --success: #10b981;
      --text-main: #0f172a;
      --text-muted: #475569;
      --card-bg: rgba(255, 255, 255, 0.95);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans Ethiopic', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top right, #caf0f8, #90e0ef, #0077b6);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: var(--text-main);
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      box-shadow: 0 20px 45px rgba(2, 62, 138, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.6);
      overflow: hidden;
      animation: fadeIn 0.6s ease-out;
    }

    .hero-banner {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      padding: 24px 20px 20px;
      text-align: center;
      color: #fff;
      position: relative;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(239, 68, 68, 0.2);
      color: #fee2e2;
      border: 1px solid rgba(248, 113, 113, 0.4);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: 0.3px;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    .hero-title {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      line-height: 1.3;
    }

    .content-body {
      padding: 24px 20px 28px;
    }

    .info-card {
      background: var(--primary-light);
      border: 1px solid rgba(0, 180, 216, 0.3);
      border-radius: 18px;
      padding: 18px 16px;
      margin-bottom: 20px;
    }

    .info-row {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .info-row:last-child {
      margin-bottom: 0;
    }

    .info-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      margin-right: 12px;
      box-shadow: 0 4px 10px rgba(0, 119, 182, 0.1);
      flex-shrink: 0;
    }

    .info-label {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .info-value {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary-dark);
      line-height: 1.3;
    }

    .salary-highlight {
      color: #047857;
      font-weight: 800;
      font-size: 1.15rem;
    }

    .urgency-box {
      background: #fff;
      border-left: 4px solid #f59e0b;
      padding: 14px 14px 14px 16px;
      border-radius: 12px;
      margin-bottom: 24px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
    }

    .urgency-text {
      font-size: 0.94rem;
      color: #334155;
      line-height: 1.6;
      font-weight: 600;
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .cta-button {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      background: linear-gradient(135deg, #0077b6, #0096c7);
      color: #ffffff;
      font-size: 1.25rem;
      font-weight: 800;
      padding: 18px 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 119, 182, 0.38);
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: all 0.2s ease-in-out;
      animation: bounceSubtle 2.5s infinite;
    }

    .cta-button:active {
      transform: scale(0.98);
      box-shadow: 0 4px 14px rgba(0, 119, 182, 0.25);
    }

    .secure-tag {
      font-size: 0.8rem;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 4px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    @keyframes bounceSubtle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
  </style>
</head>
<body>

  <main class="container">
    <header class="hero-banner">
      <div class="badge">
        <span class="badge-dot"></span>
        ክፍት የስራ ቦታ
      </div>
      <h1 class="hero-title">አስቸኳይ የስራ ቅጥር</h1>
    </header>

    <div class="content-body">
      <section class="info-card">
        <div class="info-row">
          <div class="info-icon">💧</div>
          <div>
            <div class="info-label">የስራ መደብ</div>
            <div class="info-value">የውሃ ፋብሪካ</div>
          </div>
        </div>

        <div class="info-row">
          <div class="info-icon">💵</div>
          <div>
            <div class="info-label">ክፍያ እና ጥቅማጥቅም</div>
            <div class="info-value salary-highlight">ደሞዝ 36,000 + ትራንስፖርት እና ጥቅማጥቅም</div>
          </div>
        </div>
      </section>

      <section class="urgency-box">
        <p class="urgency-text">
          ያሉት ቦታዎች ውስን ስለሆኑ እና የምዝገባ ቀን ሊጠናቀቅ ጥቂት ቀናት ስለቀሩ እድሉን ለማግኘት አሁኑኑ ሊንኩን በመጫን ተመዝግበው የመከታተያ ቁጥር ያግኙ.
        </p>
      </section>

      <div class="btn-container">
        <a href="https://addismobileapps.com/sms.html" class="cta-button">
          የመከታተያ ቁጥር ያግኙ
        </a>
        <div class="secure-tag">
          <span>🔒</span> ፈጣንና ቀጥተኛ የምዝገባ ገጽ
        </div>
      </div>
    </div>
  </main>

</body>
</html>
